name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: fetch rhwp sources
        shell: bash
        run: bash tools/fetch-rhwp.sh
      - name: fetch pdfium (pinned, SHA-256)
        shell: bash
        run: bash tools/fetch-pdfium.sh
      - name: cache ko-dic (lindera dictionary source + build cache)
        uses: actions/cache@v4
        with:
          path: third_party/ko-dic
          key: ko-dic-${{ runner.os }}-${{ hashFiles('tools/fetch-ko-dic.sh', 'Cargo.lock') }}
      - name: fetch ko-dic (pinned, SHA-256)
        shell: bash
        run: bash tools/fetch-ko-dic.sh
      - name: libclang (windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Strawberry Perl for vendored OpenSSL (windows)
        if: runner.os == 'Windows'
        run: echo "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" >> $env:GITHUB_ENV
      - run: cargo build --workspace --release
      - name: put llama DLLs next to binaries (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dlls = Get-ChildItem target/release/build -Recurse -Filter *.dll | Where-Object { $_.FullName -match 'llama-sys' }
          $dlls | ForEach-Object { Copy-Item $_.FullName target/release/ }
          $dlls | ForEach-Object { Copy-Item $_.FullName target/release/deps/ }
      - name: put pdfium next to binaries (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp third_party/pdfium/win-x64/bin/pdfium.dll target/release/
      - run: cargo test --workspace --release
      # 시험은 --pdfium 으로 경로를 직접 준다 — 제품 배치(실행 파일 옆 pdfium.dll, 인자 없음)는 여기서 확인한다.
      # 결과에 korean.pdf 가 나오면 본문(렛츠런파크)을 읽은 것 = pdfium 을 불러왔다(못 불러오면 파일 이름으로만 찾힌다).
      - name: kra-search default pdfium path (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          target/release/kra-search.exe --home "$RUNNER_TEMP/kh" index --root crates/extract/tests/fixtures/pdf
          target/release/kra-search.exe --home "$RUNNER_TEMP/kh" search 렛츠런파크 | tee "$RUNNER_TEMP/out.txt"
          grep -q "korean.pdf" "$RUNNER_TEMP/out.txt"
      - name: cache dev models
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ hashFiles('tools/fetch-models.sh') }}
      - name: model tests (real EmbeddingGemma 2 on this OS)
        shell: bash
        run: |
          bash tools/fetch-models.sh
          cargo test -p embed --release --test model --test reference -- --include-ignored --test-threads 1
          # llama.cpp 로컬 패치(logits 버퍼 미할당)가 빠지면 메모리가 1GB 늘어 여기서 떨어진다 — INC-004
          cargo test -p diag --release --test memory -- --include-ignored --test-threads 1
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/fetch-rhwp.sh
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: no HTTP crates in runtime dependency graph
        run: bash tools/check-no-net.sh
