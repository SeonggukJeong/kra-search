name: release-m0
on:
  push:
    tags: ["m0-diag-*"]
permissions: { contents: write }
jobs:
  build:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: fetch rhwp sources
        shell: bash
        run: bash tools/fetch-rhwp.sh
      - run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - run: cargo build --release -p diag
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          OUT=kra-diag-${GITHUB_REF_NAME}-win64
          mkdir -p $OUT/models
          cp target/release/kra-diag.exe $OUT/
          find target/release/build -path '*llama-sys*' -name '*.dll' -exec cp {} $OUT/ \;
          bash tools/fetch-models.sh
          cp models/*.gguf $OUT/models/
          cp docs/m0/README-diag.txt $OUT/
          ls -la $OUT $OUT/models
          7z a $OUT.zip $OUT > /dev/null
          sha256sum $OUT.zip > $OUT.zip.sha256
          cat $OUT.zip.sha256
          echo "OUT=$OUT" >> $GITHUB_ENV
      - name: smoke test (env + bench on the packaged build)
        shell: bash
        run: |
          cd "$OUT"
          ./kra-diag.exe env
          ./kra-diag.exe bench --skip-flat
          grep -q "초당" kra-diag-summary.txt
      - name: release
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" "$OUT.zip" "$OUT.zip.sha256" --prerelease --title "M0 진단 도구 $GITHUB_REF_NAME" --notes-file docs/m0/README-diag.txt
