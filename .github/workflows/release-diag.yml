name: release-diag
on:
  push:
    tags: ["m0-diag-*", "m1-diag-*"]
permissions: { contents: write }
jobs:
  build:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: fetch rhwp sources
        shell: bash
        run: bash tools/fetch-rhwp.sh
      - name: fetch pdfium
        shell: bash
        run: bash tools/fetch-pdfium.sh win-x64
      - run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - run: cargo build --release -p diag
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          OUT=kra-diag-${GITHUB_REF_NAME}-win64
          mkdir -p $OUT/models
          cp target/release/kra-diag.exe $OUT/
          find target/release/build -path '*llama-sys*' -name '*.dll' -exec cp {} $OUT/ \;
          # llama/ggml DLL이 쓰는 VC++ 런타임을 exe 옆에 둔다(앱 로컬 배포 — 별도 설치 불필요)
          for f in vcruntime140.dll vcruntime140_1.dll msvcp140.dll; do cp "/c/Windows/System32/$f" $OUT/; done
          bash tools/fetch-models.sh
          cp models/*.gguf $OUT/models/
          cp docs/diag/README-diag.txt $OUT/
          cp third_party/pdfium/win-x64/bin/pdfium.dll $OUT/
          mkdir -p $OUT/licenses/pdfium && cp -r third_party/pdfium/win-x64/LICENSE third_party/pdfium/win-x64/licenses/* $OUT/licenses/pdfium/
          ls -la $OUT $OUT/models
          7z a $OUT.zip $OUT > /dev/null
          sha256sum $OUT.zip > $OUT.zip.sha256
          cat $OUT.zip.sha256
          echo "OUT=$OUT" >> $GITHUB_ENV
      - name: smoke test (env + bench on the packaged build)
        shell: bash
        run: |
          cd "$OUT"
          ./kra-diag.exe env
          ./kra-diag.exe bench --skip-flat
          grep -q "초당" kra-diag-summary.txt
          # 실행 파일 옆 pdfium 이 실제로 불러와지는지 — 시험 자료 PDF 중 글자 있는 3개가 읽혀야 한다(분모는 시험 자료가 늘면 바뀌므로 성공 수만 본다)
          ./kra-diag.exe extract-stats --root "$GITHUB_WORKSPACE/crates/extract/tests/fixtures"
          grep -q "pdf 3/" kra-diag-summary.txt
      - name: release
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" "$OUT.zip" "$OUT.zip.sha256" --prerelease --title "진단 도구 $GITHUB_REF_NAME" --notes-file docs/diag/README-diag.txt
