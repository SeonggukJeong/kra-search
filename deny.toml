[advisories]
# 관리 중단 경고는 우리가 직접 고른 의존성에만 적용(rhwp 등 서드파티의 하위 의존성은 제외)
unmaintained = "workspace"
# rhwp(경로 의존)가 직접 쓰는 크레이트라 "workspace" 범위에 잡힌다. 보안 취약점이 아닌 "관리 중단" 경고이며,
# rhwp 업그레이드 때 다시 확인한다.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste — rhwp direct dependency; unmaintained notice only" },
  { id = "RUSTSEC-2026-0192", reason = "rustybuzz — rhwp renderer dependency; unmaintained notice only" },
  { id = "RUSTSEC-2026-0206", reason = "ttf-parser — rhwp renderer dependency; unmaintained notice only" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0"]
confidence-threshold = 0.9
exceptions = [
  # ureq(빌드 전용)의 TLS 루트 인증서 목록. 실행 파일에 들어가지 않는다.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
deny = [
  { name = "reqwest" }, { name = "hyper" },
  # lindera 사전 빌드 스크립트(build_rs 기능)만 쓴다 — 실행 의존 그래프에는 없다(tools/check-no-net.sh 가 확인).
  { name = "ureq", wrappers = ["lindera-dictionary"] },
  { name = "isahc" }, { name = "curl" }, { name = "attohttpc" },
]

[sources]
unknown-git = "deny"
