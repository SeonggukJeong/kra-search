[advisories]
# 관리 중단 경고는 우리가 직접 고른 의존성에만 적용(rhwp 등 서드파티의 하위 의존성은 제외)
unmaintained = "workspace"
# rhwp(경로 의존)가 직접 쓰는 크레이트라 "workspace" 범위에 잡힌다. 보안 취약점이 아닌 "관리 중단" 경고이며,
# rhwp 업그레이드 때 다시 확인한다.
ignore = [
  { crate = "paste", reason = "rhwp direct dependency; unmaintained notice only" },
  { crate = "rustybuzz", reason = "rhwp direct dependency (renderer); unmaintained notice only" },
  { crate = "ttf-parser", reason = "rhwp direct dependency (renderer); unmaintained notice only" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0"]
confidence-threshold = 0.9

[bans]
deny = [
  { name = "reqwest" }, { name = "hyper" }, { name = "ureq" },
  { name = "isahc" }, { name = "curl" }, { name = "attohttpc" },
]

[sources]
unknown-git = "deny"
