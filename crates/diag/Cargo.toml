[package]
name = "diag"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kra-diag"
path = "src/main.rs"

[dependencies]
doc = { path = "../doc" }
embed = { path = "../embed" }
extract = { path = "../extract" }
platform = { path = "../platform" }
vector = { path = "../vector" }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
sysinfo = "0.39"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting"] }
wait-timeout = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry",
  "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Diagnostics_Debug", "Win32_System_ErrorReporting",
  "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation"] }
wmi = "0.18"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
